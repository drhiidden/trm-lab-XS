# Configuración para CNN baseline en MNIST
# Para comparación con TRM

# Modelo
model_name: "cnn_baseline"
model_config:
  input_channels: 1
  num_classes: 10
  dropout: 0.1

# Dataset
dataset:
  name: "mnist"
  config:
    batch_size: 64
    num_workers: 4
    flatten: false
    sequence_mode: false

# Entrenamiento
training:
  epochs: 50
  learning_rate: 0.001
  weight_decay: 0.0001
  scheduler: "step"
  step_size: 20
  gamma: 0.1
  gradient_clip: 1.0
  accumulation_steps: 1
  
# Optimizador
optimizer:
  name: "adam"
  lr: 0.001
  weight_decay: 0.0001
  betas: [0.9, 0.999]
  eps: 1e-8

# Scheduler
scheduler:
  name: "step"
  step_size: 20
  gamma: 0.1

# Pérdida
loss:
  name: "cross_entropy"
  label_smoothing: 0.0

# Métricas
metrics:
  - "accuracy"
  - "top_k_accuracy"
  - "per_class_accuracy"

# Logging
logging:
  use_wandb: true
  project: "trm-lab"
  experiment_name: "cnn_mnist"
  log_interval: 100
  save_interval: 1000
  eval_interval: 500

# Checkpoints
checkpoints:
  save_dir: "logs/mnist/cnn_baseline"
  save_best: true
  save_last: true
  monitor_metric: "val_accuracy"
  mode: "max"

# Dispositivo
device: "auto"

# Semilla
seed: 42

# Reproducibilidad
deterministic: true
benchmark: false
